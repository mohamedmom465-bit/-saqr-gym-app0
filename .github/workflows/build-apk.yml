name: Build SAQR GYM APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: إنشاء فولدرات المنصات
        run: flutter create --platforms=android .

      - name: رفع إصدار الـ SDK لـ 36 لكل المكتبات
        run: |
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties

      - name: تنزيل المكتبات
        run: flutter pub get

      - name: إضافة صلاحيات الكاميرا
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = '<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<application', perms + '    <application', 1)
              open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: بناء الـ APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: saqr-gym-apk
          path: build/app/outputs/flutter-apk/app-release.apk
